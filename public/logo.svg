<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coinGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0B1523" />
      <stop offset="85%" stopColor="#040810" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#475569" />
      <stop offset="35%" stopColor="#0EA5E9" />
      <stop offset="65%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="50%" stopColor="#0070F3" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <linearGradient id="earthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#065F46" />
      <stop offset="50%" stopColor="#047857" />
      <stop offset="100%" stopColor="#064E3B" />
    </linearGradient>
    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#CBD5E1" />
      <stop offset="50%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="stemClip">
      <rect x="135" y="85" width="85" height="320" rx="4" />
    </clipPath>
    <clipPath id="upperArmClip">
      <polygon points="216,192 312,92 390,92 216,270" />
    </clipPath>
    <clipPath id="lowerArmClip">
      <polygon points="216,230 380,395 320,405 216,300" />
    </clipPath>
  </defs>

  <circle cx="250" cy="250" r="235" fill="url(#coinGrad)" />
  <circle cx="250" cy="250" r="228" fill="none" stroke="url(#rimGrad)" stroke-width="10" stroke-linecap="round" />
  <path d="M 330 65 A 228 228 0 0 1 475 270" fill="none" stroke="#00E5FF" stroke-width="11" filter="url(#glow)" stroke-linecap="round" />
  <path d="M 470 290 A 228 228 0 0 1 310 472" fill="none" stroke="#10B981" stroke-width="11" filter="url(#glow)" stroke-linecap="round" />

  <path d="M 60 325 C 90 280 135 240 180 340 C 130 330 90 345 60 325 Z" fill="url(#chromeBevel)" opacity="0.8" />
  <path d="M 215 270 C 310 180 430 180 440 250 C 450 330 320 420 215 425" fill="none" stroke="#00D2FF" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 225 282 C 320 200 420 200 428 260 C 435 325 325 395 240 435" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" filter="url(#glow)" />

  <!-- STEM (Opencast Mining Grayscale) -->
  <g>
    <rect x="130" y="80" width="95" height="330" rx="6" fill="#1E293B" stroke="#64748B" stroke-width="4" />
    <rect x="135" y="85" width="85" height="320" rx="4" fill="#0F172A" />
    <g clip-path="url(#stemClip)">
      <rect x="135" y="85" width="85" height="80" fill="#E2E8F0" />
      <circle cx="185" cy="130" r="18" fill="#F8FAFC" />
      <polygon points="135,145 220,135 220,165 135,175" fill="#94A3B8" />
      <polygon points="135,170 220,158 220,190 135,200" fill="#64748B" />
      <polygon points="135,195 220,185 220,225 135,235" fill="#475569" />
      <path d="M 140 160 Q 185 190 160 230 Q 140 270 200 290" fill="none" stroke="#CBD5E1" stroke-width="7" stroke-dasharray="4 2" />
      
      <!-- Haul Truck -->
      <g transform="translate(150, 230) scale(0.65)">
        <rect x="0" y="10" width="35" height="20" rx="3" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5" />
        <polygon points="5,10 32,10 36,0 2,0" fill="#000000" />
        <path d="M 4 0 Q 18 -8 34 0" fill="#1E293B" />
        <circle cx="8" cy="30" r="7" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5" />
        <circle cx="28" cy="30" r="7" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5" />
        <circle cx="34" cy="20" r="2" fill="#FDE047" />
      </g>

      <!-- Excavator Shovel -->
      <g transform="translate(142, 305) scale(0.7)">
        <rect x="5" y="60" width="45" height="14" rx="4" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5" />
        <rect x="8" y="38" width="28" height="22" rx="3" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5" />
        <line x1="28" y1="42" x2="60" y2="15" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" />
        <line x1="60" y1="15" x2="72" y2="40" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
        <path d="M 68 38 L 84 45 L 80 58 L 65 52 Z" fill="#0F172A" stroke="#E2E8F0" stroke-width="2" />
        <ellipse cx="78" cy="65" rx="16" ry="7" fill="#000000" />
      </g>
    </g>
    <rect x="135" y="85" width="4" height="320" fill="#F8FAFC" opacity="0.6" />
    <rect x="216" y="85" width="4" height="320" fill="#0F172A" opacity="0.8" />
  </g>

  <!-- UPPER ARM (Cyber Blue Circuit) -->
  <g>
    <polygon points="216,192 312,92 390,92 216,270" fill="url(#circuitGrad)" stroke="#60A5FA" stroke-width="4" />
    <g clip-path="url(#upperArmClip)">
      <path d="M 220 230 L 260 190 L 320 190 L 350 160 L 380 160" fill="none" stroke="#67E8F9" stroke-width="4" filter="url(#glow)" />
      <path d="M 235 255 L 280 210 L 330 210 L 360 180" fill="none" stroke="#38BDF8" stroke-width="3.5" />
      <path d="M 255 170 L 290 135 L 340 135 L 365 110" fill="none" stroke="#A5F3FC" stroke-width="3" />
      <circle cx="260" cy="190" r="5" fill="#FFFFFF" filter="url(#glow)" />
      <circle cx="350" cy="160" r="5" fill="#FFFFFF" filter="url(#glow)" />
      <circle cx="380" cy="160" r="6" fill="#00E5FF" />
      <circle cx="330" cy="210" r="4.5" fill="#FFFFFF" />
      <circle cx="290" cy="135" r="4.5" fill="#67E8F9" />
      <circle cx="365" cy="110" r="5.5" fill="#FFFFFF" filter="url(#glow)" />
    </g>
    <polygon points="216,192 312,92 390,92" fill="none" stroke="#BAE6FD" stroke-width="3" />
  </g>

  <!-- LOWER ARM (Satellite & Green Boundary) -->
  <g>
    <polygon points="216,230 380,395 320,405 216,300" fill="url(#earthGrad)" stroke="#34D399" stroke-width="4" />
    <g clip-path="url(#lowerArmClip)">
      <rect x="200" y="220" width="200" height="200" fill="#064E3B" />
      <circle cx="280" cy="310" r="45" fill="#047857" opacity="0.6" />
      <circle cx="340" cy="360" r="55" fill="#065F46" opacity="0.7" />
      <path d="M 290 330 Q 330 310 360 340 Q 350 380 310 375 Z" fill="#1E293B" stroke="#64748B" stroke-width="2" />
      <path d="M 265 310 Q 310 280 365 315 Q 370 385 305 390 Z" fill="none" stroke="#00FF66" stroke-width="4" filter="url(#glow)" />
      <path d="M 260 270 A 20 20 0 0 1 275 285" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#glow)" />
      <path d="M 255 262 A 32 32 0 0 1 280 290" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.8" />
      
      <!-- Satellite -->
      <g transform="translate(290, 260) rotate(-40) scale(0.9)">
        <rect x="-32" y="-7" width="22" height="14" rx="2" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="-21" y1="-7" x2="-21" y2="7" stroke="#E2E8F0" stroke-width="1" />
        <rect x="10" y="-7" width="22" height="14" rx="2" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.5" />
        <line x1="21" y1="-7" x2="21" y2="7" stroke="#E2E8F0" stroke-width="1" />
        <rect x="-8" y="-9" width="16" height="18" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
        <path d="M -5 -9 Q 0 -16 5 -9 Z" fill="#E2E8F0" stroke="#0F172A" stroke-width="1" />
        <line x1="0" y1="-12" x2="0" y2="-18" stroke="#00E5FF" stroke-width="2" />
      </g>
    </g>
  </g>
  <circle cx="216" cy="248" r="8" fill="#E2E8F0" stroke="#00D2FF" stroke-width="2" filter="url(#glow)" />
</svg>
